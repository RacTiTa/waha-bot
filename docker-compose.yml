services:
  waha:
    image: devlikeapro/waha:latest
    # Solo hay imagen amd64; en Apple Silicon corre emulada via Rosetta/QEMU.
    platform: linux/amd64
    container_name: waha
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Protege la API de WAHA. Tiene que coincidir con WAHA_API_KEY del .env del bot.
      WHATSAPP_API_KEY: ${WAHA_API_KEY}

      # A dónde manda los eventos. host.docker.internal = tu Mac, visto desde el contenedor.
      WHATSAPP_HOOK_URL: http://host.docker.internal:${PORT:-3001}/webhook
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_HMAC_KEY: ${WEBHOOK_HMAC_KEY}

      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_RESTART_ALL_SESSIONS: 'true'
      WAHA_PRINT_QR: 'false'

      # Dashboard en http://localhost:3000/dashboard
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}

      # Swagger docs. El dashboard manda WHATSAPP_SWAGGER_USERNAME como x-api-key
      # por un bug (https://github.com/devlikeapro/waha/issues/2269), por eso
      # tiene que ser igual a WAHA_API_KEY para que el dashboard pueda conectarse.
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD}
    volumes:
      - ./.waha-sessions:/app/.sessions
    extra_hosts:
      - 'host.docker.internal:host-gateway'
